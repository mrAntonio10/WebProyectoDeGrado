<div class="login-body">
    <div class="login-panel p-fluid">
        <div class="login-panel-header">
            <img src="assets/layout/images/login/logo-sapphire-color.png">
        </div>
            <div class="login-panel-content">
            <form autocomplete="off" [formGroup]="form">

                <div class="grid">
                    <div class="col-12">
                        <h1>Coffe Manager</h1>
                        <h2>Welcome, please use the form to sign-in</h2>
                    </div>
                    <div class="col-12">
                        <span class="p-float-label">
                            <input id="username" type="text" pInputText formControlName="email">
                            <label for="username">Email</label>
                        </span>
                    </div>
                    <div class="col-12">
                        <span class="p-float-label">
                            <input id="password" type="password" pInputText formControlName="password">
                            <label for="password">Password</label>
                        </span>
                    </div>
                    <!-- <div class="col-6" style="padding-top: 1.25em">
                        <a href="#">Forget Password?</a>
                    </div> -->
                    <div class="col-6" style="text-align: right">
                        <input pButton pRipple type="submit" class="submit" value="Iniciar Sesión" (click)="submitForm()"  [disabled]="!form.valid">
                    </div>
                </div>
            </form>
            </div>
    </div>
</div>
