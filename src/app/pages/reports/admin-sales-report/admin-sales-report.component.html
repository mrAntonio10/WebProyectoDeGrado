<div>
    <div class="grid">
        <div class="col-12">
            <div class="card">
                <p-panel header="Opciones de Reporte de Ventas (Admin)" [toggleable]="true" [collapsed]="false">
                    <form [formGroup]="formGroup" (ngSubmit)="submitForm()">
                        <div class="p-fluid p-formgrid grid">

                            <div class="field col-12 md:col-3">
                                <label for="idBranchOffice" class="font-bold block mb-2"> Sucursal </label>
                                <p-dropdown [formControlName]="'idBranchOffice'" [id]="'idBranchOffice'"
                                    [options]="branchOffices" optionLabel="name" optionValue="id"
                                    [(ngModel)]="selectedBranchOffice"
                                    placeholder="Seleccione una sucursal"></p-dropdown>
                            </div>

                            <div class="field col-12 md:col-3">
                                <label for="startDate" class="font-bold block mb-2"> Fecha inicio </label>
                                <span class="p-input-icon-right">
                                    <p-calendar [(ngModel)]="startDate" showIcon="true" icon="pi pi-calendar"
                                        [formControl]="formGroup.controls['startDate']"
                                        dateFormat="dd-MM-yy"></p-calendar>
                                </span>
                            </div>

                            <div class="field col-12 md:col-3">
                                <label for="endDate" class="font-bold block mb-2"> Fecha fin </label>
                                <span class="p-input-icon-right">
                                    <p-calendar [(ngModel)]="endDate" showIcon="true" icon="pi pi-calendar"
                                        [formControl]="formGroup.controls['endDate']"
                                        dateFormat="dd-MM-yy"></p-calendar>
                                </span>
                            </div>

                            <div class="field col-12 md:col-3">
                                <label> Estado Documento </label>
                                <p-dropdown [formControlName]="'state'" [id]="'state'" [options]="states"
                                    optionLabel="name" optionValue="code" [(ngModel)]="selectedState"></p-dropdown>
                            </div>

                        </div>
                        <div class="p-fluid p-formgrid grid">
                            <div class="field col-12 md:col-4">
                                <button pButton type="button" label="Generar Reporte PDF" icon="pi pi-file-pdf"
                                    class="p-button-help" [disabled]="!formGroup.valid"
                                    (click)="generateAdminSalesPDFReport()"></button>
                            </div>
                        </div>
                    </form>
                </p-panel>
            </div>
        </div>
    </div>
</div>

<div class="col-6 flex justify-content-center">
    <p-toast />
</div>
<p-confirmDialog></p-confirmDialog>
