<div class="layout-topbar rekids-flex-topbar" style="background: linear-gradient(90deg, #0077D8 0%, #009FE3 100%); border-bottom: 4px solid #F39200;">

    <!-- GRUPO IZQUIERDO EN FLEX: Botón Hamburguesa (relative, sin superponerse) + Foto de Marca RE KIDS -->
    <div class="rekids-topbar-left">
        <a *ngIf="showHamburgerMenu" href="#" class="layout-menubutton rekids-flex-menubutton"
            [ngClass]="{'layout-menubutton-active': app.menuActive}" (click)="app.onMenuButtonClick($event)"
            title="Menú de Navegación">
            <div class="layout-menubutton-icon"></div>
        </a>

        <a href="#" (click)="goToAboutUs($event)" class="rekids-brand-link" title="Quiénes Somos — RE KIDS">
            <img src="assets/layout/images/myImg/rekids-logo.jpg" alt="RE KIDS" class="rekids-topbar-logo-img" />
            <div class="rekids-brand-titles">
                <span class="rekids-brand-slogan">
                    EL SEGUNDO ESTRENO
                </span>
                <span *ngIf="isAdmin" class="rekids-topbar-admin-badge">
                    Vista Admin
                </span>
            </div>
        </a>
    </div>

    <!-- MENÚ LATERAL / DESPLEGABLE HAMBURGUESA -->
    <div class="rekids-topbar-center">
        <app-menu *ngIf="showHamburgerMenu"></app-menu>
    </div>

    <!-- GRUPO DERECHO EN FLEX: Solo visible cuando hay sesión Admin activa -->
    <div class="rekids-topbar-right" *ngIf="isAdmin">
        <div class="rekids-profile-wrapper">
            <a href="#" class="profile-menu-button rekids-profile-btn" (click)="app.onTopbarUserMenuButtonClick($event)" title="Cuenta Admin">
                <i class="pi pi-user" style="font-size: 1.6rem; color: whitesmoke;"></i>
            </a>
            <ul class="layout-profile-menu fadeInDown" [ngClass]="{'layout-profile-menu-active': app.topbarUserMenuActive}" (click)="app.onTopbarUserMenuClick($event)">
                <li role="menuitem">
                    <a href="#" pRipple (click)="logOut()">
                        <i class="pi pi-sign-out"></i>
                        <span>Cerrar Sesión</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

</div>
