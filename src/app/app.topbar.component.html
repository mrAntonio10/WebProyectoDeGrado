<div class="layout-topbar" style="background: linear-gradient(90deg, #0077D8 0%, #009FE3 100%); border-bottom: 4px solid #F39200;">

    <!-- Menú hamburguesa oculto en el Portal de Comprador -->
    <a *ngIf="showHamburgerMenu" href="#" class="layout-menubutton"
        [ngClass]="{'layout-menubutton-active': app.menuActive}" (click)="app.onMenuButtonClick($event)">
        <div class="layout-menubutton-icon"></div>
    </a>

    <div class="layout-topbar-grid" style="align-items: center;">
        <div class="layout-topbar-grid-column layout-topbar-grid-column-fixed"
            [ngStyle]="{'padding-left': showHamburgerMenu ? '0.5rem' : '1.5rem'}"
            style="display: flex; align-items: center; gap: 10px;">
            <a href="/#/dashboard/comercial-management/sales-panel" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                <img src="assets/layout/images/myImg/rekids-logo.jpg" alt="RE KIDS"
                    style="height: 44px; border-radius: 10px; background: #ffffff; padding: 2px 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.18);" />
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1.15rem; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); white-space: nowrap;">
                    EL SEGUNDO ESTRENO
                </span>
            </a>
        </div>

        <div class="layout-topbar-grid-column">
            <app-menu *ngIf="showHamburgerMenu"></app-menu>
        </div>

        <div class="layout-topbar-grid-column layout-topbar-grid-column-fixed background-color-white" *ngIf="showHamburgerMenu">
            <a href="#" class="profile-menu-button" (click)="app.onTopbarUserMenuButtonClick($event)">
                <i class="pi pi-user" style="font-size: 2.2rem; color: whitesmoke;"></i>
            </a>
            <ul class="layout-profile-menu fadeInDown" [ngClass]="{'layout-profile-menu-active': app.topbarUserMenuActive}" (click)="app.onTopbarUserMenuClick($event)">
                <li role="menuitem">
                    <a href="#" pRipple (click)="logOut()">
                        <i class="pi pi-sign-out"></i>
                        <span>Cerrar Sesión Admin</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

</div>
